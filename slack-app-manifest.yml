display_information:
  name: Lore
  description: The company brain that shows up to your incidents — built on FalkorDB
  background_color: "#0b0b0d"
features:
  app_home:
    messages_tab_enabled: true
    messages_tab_read_only_enabled: false
  bot_user:
    display_name: Lore
    always_online: true
  slash_commands:
    - command: /lore
      description: Ask Lore, open an incident, or link your account to the org graph
      usage_hint: "ask <question> | incident <service> <title> | iam <person-id> | whoami"
      should_escape: false
oauth_config:
  scopes:
    bot:
      - app_mentions:read
      - channels:history
      - channels:read
      - chat:write
      - chat:write.public
      - commands
      - im:history
      - im:read
      - im:write
      - users:read
      - users:read.email
settings:
  event_subscriptions:
    bot_events:
      - app_mention
      - message.channels
      - message.im
  interactivity:
    is_enabled: true
  org_deploy_enabled: false
  socket_mode_enabled: true
  token_rotation_enabled: false
